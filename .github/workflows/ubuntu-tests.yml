name: Tests

on:
  push:
    branches: [ develop-qt6 ]
  pull_request:
    branches: [ develop-qt6 ]

permissions:
  contents: read

env:
  # The offscreen plugin draws, the minimal one does not. The tests of the ui
  # layer need the drawing operations. The image sets it too; named here as well
  # so that a reader of this file knows what the run assumes.
  QT_QPA_PLATFORM: offscreen
  # The minimum the project declares. Building against it is what makes the
  # declaration worth anything, and it is what picks the image below.
  QT_VERSION: 6.8.3

jobs:
  build:
    runs-on: ubuntu-latest

    # Everything the build needs comes from the image: Qt, gwenhywfar with its
    # qt6 binding, aqbanking, libchipcard, the docking system and the SQLCipher
    # sql driver. It is built by deps-image.yml, which is the only workflow with
    # write access to the registry.
    #
    # This used to be nine steps that cloned five foreign repositories and
    # cached the result. A run without a cache hit depended on three foreign
    # servers being up, and every clone fetched a tag, which can be moved.
    container:
      image: ghcr.io/${{ github.repository }}/ci-ubuntu:qt6.8.3

    steps:
      - name: Check out the code
        uses: actions/checkout@v7.0.1

      - name: Check what the image brought
        run: |
          set -euxo pipefail

          # Asked here rather than left for the build. A Qt other than the one
          # this run means to test would pass silently, and a missing sql driver
          # would show up as fourteen failing targets with no hint at the cause.
          test "$(qmake6 -query QT_VERSION)" = "$QT_VERSION"
          test -f "$(qmake6 -query QT_INSTALL_PLUGINS)/sqldrivers/libqsqlcipher.so"

          pkg-config --modversion gwenhywfar gwengui-qt6 aqbanking libchipcard-client

          # Passed to the configure step below. install-qt-action used to set it.
          echo "QT_ROOT_DIR=$(qmake6 -query QT_INSTALL_PREFIX)" >> "$GITHUB_ENV"

      - name: Configure
        # The ui layer links libgwengui-qt6, which carries Qt Widgets in its own
        # DT_NEEDED. The linker resolves such a transitive dependency at link
        # time and does not consult rpath for it, so the Qt library directory has
        # to be named on its own. The core no longer needs this; it stopped
        # linking that library. Whether the ui tests still do is what a run
        # without the flag would answer.
        run: cmake --preset debug -DCMAKE_EXE_LINKER_FLAGS="-Wl,-rpath-link,$QT_ROOT_DIR/lib"

      - name: Build
        run: cmake --build --preset debug

      - name: Test
        run: ctest --preset debug
