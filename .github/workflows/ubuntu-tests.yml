name: Tests

on:
  push:
    branches: [ develop-qt6 ]
  pull_request:
    branches: [ develop-qt6 ]

permissions:
  contents: read

env:
  # The offscreen plugin draws, the minimal one does not. The tests of the ui
  # layer need the drawing operations.
  QT_QPA_PLATFORM: offscreen
  # The minimum the project declares. Building against it is what makes the
  # declaration worth anything.
  QT_VERSION: 6.8.3
  # Every version below is pinned so that a run stays reproducible and meets
  # the minimums that src/CMakeLists.txt requires.
  GWENHYWFAR_VERSION: 5.14.1
  AQBANKING_VERSION: 6.9.2
  LIBCHIPCARD_VERSION: 5.1.6
  ADS_VERSION: 5.0.0
  QSQLCIPHER_VERSION: v6.6-1
  DEPS_PREFIX: /usr/local

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v7.0.1

      - name: Install system packages
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkgconf \
            libtool \
            automake \
            gettext \
            git \
            libgcrypt20-dev \
            libgpg-error-dev \
            libgnutls28-dev \
            libxmlsec1-dev \
            libpcsclite-dev \
            libsqlite3-dev \
            libgl1-mesa-dev \
            mesa-common-dev \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-cursor0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        timeout-minutes: 10
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          host: linux
          arch: linux_gcc_64
          # The project links Concurrent, Core, Gui, LinguistTools, Sql, Svg
          # and Widgets. All of them ship with the base package.
          modules: ''
          cache: true

      - name: Cache the dependencies built from source
        id: cache-deps
        uses: actions/cache@v6.1.0
        with:
          path: ~/.olbaflinx-deps
          key: >-
            ${{ runner.os }}-deps-qt${{ env.QT_VERSION }}-gwen${{ env.GWENHYWFAR_VERSION }}-aqb${{ env.AQBANKING_VERSION }}-chip${{ env.LIBCHIPCARD_VERSION }}-ads${{ env.ADS_VERSION }}-cipher${{ env.QSQLCIPHER_VERSION }}

      - name: Build the dependencies from source
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          workdir="$(mktemp -d)"
          cd "$workdir"

          # Every ldconfig below is load bearing, not housekeeping. aqbanking
          # generates its type sources with typemaker2, a program that ships
          # with gwenhywfar and links against it. Without a refreshed cache the
          # freshly installed library is invisible to it and the generation
          # fails with "cannot open shared object file".
          echo "$DEPS_PREFIX/lib" | sudo tee /etc/ld.so.conf.d/olbaflinx-deps.conf

          # gwenhywfar carries the Qt binding the project links against. Asking
          # for the qt5 gui here is what left gwengui-qt6 unavailable before.
          git clone --recursive https://git.aquamaniac.de/git/gwenhywfar
          cd gwenhywfar
          git checkout "$GWENHYWFAR_VERSION"
          make -f Makefile.cvs
          ./configure --prefix="$DEPS_PREFIX" --with-guis="cpp qt6"
          make --jobs=$(nproc) all
          sudo make install
          sudo ldconfig
          cd "$workdir"

          git clone --recursive https://git.aquamaniac.de/git/libchipcard
          cd libchipcard
          git checkout "$LIBCHIPCARD_VERSION"
          make -f Makefile.cvs
          ./configure --prefix="$DEPS_PREFIX"
          make --jobs=$(nproc) all
          sudo make install
          sudo ldconfig
          cd "$workdir"

          # libchipcard reads datadir before it defines it. pkg-config resolves
          # pkgdatadir to an empty prefix without this.
          sudo patch "$DEPS_PREFIX/lib/pkgconfig/libchipcard-client.pc" \
            < "$GITHUB_WORKSPACE/res/ci/ubuntu/libchipcard-client.pc.patch"

          git clone --recursive https://git.aquamaniac.de/git/aqbanking
          cd aqbanking
          git checkout "$AQBANKING_VERSION"
          make -f Makefile.cvs
          ./configure --prefix="$DEPS_PREFIX"
          make typedefs
          make typefiles
          make --jobs=$(nproc) all
          sudo make install
          sudo ldconfig
          cd "$workdir"

          git clone https://github.com/githubuser0xFFFF/Qt-Advanced-Docking-System.git
          cd Qt-Advanced-Docking-System
          git checkout "$ADS_VERSION"
          cmake -G Ninja -B cbuild \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="$DEPS_PREFIX"
          cmake --build cbuild
          sudo cmake --install cbuild
          sudo ldconfig
          cd "$workdir"

          # The plugin has to carry the driver name the project asks for, and
          # its module version has to match the Qt it is built against.
          git clone https://github.com/bAmpT/qsqlcipher-qt6-cmake.git
          cd qsqlcipher-qt6-cmake
          git checkout "$QSQLCIPHER_VERSION"
          git submodule update --init --recursive
          sed -i "s|^set(QT_REPO_MODULE_VERSION.*|set(QT_REPO_MODULE_VERSION \"${QT_VERSION}\")|" .cmake.conf
          sed -i "s|OUTPUT_NAME qsqlitecipher|OUTPUT_NAME qsqlcipher|" qsqlcipher/CMakeLists.txt
          cmake -G Ninja -B cbuild \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DQT_GENERATE_SBOM=OFF
          cmake --build cbuild
          sudo cmake --install cbuild

          # The sql driver installs into the Qt tree, everything else into
          # DEPS_PREFIX. Both have to survive into the next run.
          mkdir -p ~/.olbaflinx-deps
          sudo tar -C "$DEPS_PREFIX" -cf ~/.olbaflinx-deps/prefix.tar \
            bin lib include share
          sudo tar -C "$QT_ROOT_DIR" -cf ~/.olbaflinx-deps/qt-plugins.tar \
            plugins/sqldrivers
          sudo chown "$USER" ~/.olbaflinx-deps/prefix.tar ~/.olbaflinx-deps/qt-plugins.tar

      - name: Restore the cached dependencies
        if: steps.cache-deps.outputs.cache-hit == 'true'
        run: |
          set -euxo pipefail
          sudo tar -C "$DEPS_PREFIX" -xf ~/.olbaflinx-deps/prefix.tar
          sudo tar -C "$QT_ROOT_DIR" -xf ~/.olbaflinx-deps/qt-plugins.tar

      - name: Register the dependencies
        run: |
          echo "$DEPS_PREFIX/lib" | sudo tee /etc/ld.so.conf.d/olbaflinx-deps.conf
          sudo ldconfig
          echo "$DEPS_PREFIX/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$DEPS_PREFIX/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$DEPS_PREFIX:${CMAKE_PREFIX_PATH:-}" >> "$GITHUB_ENV"

      - name: Configure
        # libgwengui-qt6 links against Qt Widgets, so every consumer of the
        # core drags that in. The linker resolves such a transitive dependency
        # at link time and does not consult rpath for it, so the Qt library
        # directory has to be named on its own. On a developer machine Qt and
        # gwenhywfar both sit in a default search path, which is why this only
        # surfaces here.
        run: cmake --preset debug -DCMAKE_EXE_LINKER_FLAGS="-Wl,-rpath-link,$QT_ROOT_DIR/lib"

      - name: Build
        run: cmake --build --preset debug

      - name: Test
        run: ctest --preset debug
