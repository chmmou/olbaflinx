name: Dependency image

# The image carries Qt and the five libraries the project builds against:
# gwenhywfar with its qt6 binding, aqbanking, libchipcard, the Qt Advanced
# Docking System and the SQLCipher sql driver.
#
# It exists so that the test run stops cloning them. Five clones against three
# foreign servers made every run depend on their availability, and they were
# fetched by tag, which can be moved. The image is addressed by a tag naming the
# Qt version, and the digest of the run that produced it stands in its log.
#
# This is the only workflow with write access to the registry. The test run keeps
# read access to the repository and nothing more.

on:
  workflow_dispatch:
    inputs:
      qt_version:
        description: "The Qt version the image carries. The default is the minimum the project declares."
        required: false
        default: "6.8.3"
  push:
    branches: [ develop-qt6 ]
    paths:
      - 'res/ci/**'
      - '.github/workflows/deps-image.yml'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}/ci-ubuntu
  # The second image, for the run that drives the application from outside. It
  # is built on top of the first and carries a WebDriver with a Qt of its own,
  # which is why it is a second image and not more lines in the first.
  SELENIUM_IMAGE: ${{ github.repository }}/ci-ubuntu-selenium

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # The one right this workflow has that the test run does not.
      packages: write

    steps:
      - name: Check out the code
        uses: actions/checkout@v7.0.1

      - name: Decide the Qt version
        id: qt
        run: |
          set -euo pipefail
          # A push carries no input, so the default lives here as well as in the
          # Dockerfile. Both name the minimum the project declares.
          version="${{ github.event.inputs.qt_version || '6.8.3' }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building the image for Qt $version"

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to the registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: res/ci/ubuntu
          file: res/ci/ubuntu/Dockerfile
          push: true
          # The tag names the Qt version. No 'latest': it would move the test run
          # to another image without a change being visible in the repository.
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:qt${{ steps.qt.outputs.version }}
          build-args: |
            QT_VERSION=${{ steps.qt.outputs.version }}
          # The image is large and rarely rebuilt, so the layer cache is worth
          # more here than the storage it costs.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say what the image promises
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY }}/${{ env.IMAGE }}:qt${{ steps.qt.outputs.version }}"

          # Checked here rather than left for the first red test run. A missing
          # sql driver shows up there as fourteen failing targets and says
          # nothing about the image.
          docker run --rm "$image" bash -lc '
            set -euo pipefail
            qmake6 -query QT_VERSION
            pkg-config --modversion gwenhywfar aqbanking libchipcard-client
            test -f "$(qmake6 -query QT_INSTALL_PLUGINS)/sqldrivers/libqsqlcipher.so"
            objdump -p /usr/lib/libgwengui-qt6.so | grep -q "NEEDED.*libQt6Widgets"

            # The second locale, which the run from outside walks under. It
            # lives in the image beside this one and inherits this.
            locale -a | grep -q de_DE

            echo "the image carries what the test run expects"
          '

  # The image for the run from outside, built on top of the one above and
  # therefore after it. It carries a second Qt, which is the whole reason it is
  # a separate image: the test run pulls the first one on every push and has no
  # use for six hundred megabytes of desktop libraries.
  selenium:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the code
        uses: actions/checkout@v7.0.1

      - name: Decide the Qt version
        id: qt
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.qt_version || '6.8.3' }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to the registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: res/ci/ubuntu-selenium
          file: res/ci/ubuntu-selenium/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.SELENIUM_IMAGE }}:qt${{ steps.qt.outputs.version }}
          build-args: |
            QT_VERSION=${{ steps.qt.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say what the image promises
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY }}/${{ env.SELENIUM_IMAGE }}:qt${{ steps.qt.outputs.version }}"

          # The parts the run from outside stands on. Each fails in its own way
          # when absent: no service and the application is never seen, no
          # screen and the bridge never loads, no window manager and a
          # synthesised key arrives nowhere, no driver and there is nothing to
          # drive with.
          docker run --rm "$image" bash -lc '
            set -euo pipefail
            test -x /usr/libexec/at-spi-bus-launcher
            command -v Xvfb matchbox-window-manager selenium-webdriver-at-spi-run
            /opt/appium-client/bin/python -c "import appium"

            # The one thing that could silently go wrong here: the programs of
            # the tool are built against another Qt than the application, and
            # only an rpath keeps the two apart.
            ldd /usr/bin/selenium-webdriver-at-spi-inputsynth \
              | grep -q "libQt6Core.so.6 => /usr/lib/x86_64-linux-gnu/"

            echo "the image carries what the run from outside expects"
          '
